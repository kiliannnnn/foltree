[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "foltree"
version = "3.0.0"
description = "Turn folders into text and text back into folders."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kiliannnnn" }]
keywords = ["folder", "structure", "tree", "scaffold", "documentation"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "customtkinter>=5.2.2",
    "CTkToolTip>=0.8",
]

[project.urls]
Homepage = "https://github.com/kiliannnnn/foltree"

[project.scripts]
foltree = "foltree.cli:main"

[project.gui-scripts]
foltree-gui = "foltree.gui:main"

[tool.setuptools]
packages = ["foltree"]
